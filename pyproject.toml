[project]
name = "laya-orchestrator"
version = "0.1.0"
description = "Hybrid System 1 (Laya) + System 2 Autonomous Plan-to-Code Orchestrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "laya>=0.3.20",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.scripts]
laya-orchestrator = "laya_orchestrator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laya_orchestrator"]
