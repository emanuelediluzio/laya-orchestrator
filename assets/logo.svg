<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Cyber Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="240"/>
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
  </g>

  <!-- Left Icon Emblem: The Reflex Decision Engine -->
  <g transform="translate(60, 40)">
    <!-- Outer Hexagon Ring -->
    <polygon points="80,10 145,45 145,115 80,150 15,115 15,45" 
             fill="none" stroke="url(#cyanPurple)" stroke-width="2.5" opacity="0.4"/>
    
    <!-- Rotating Decision Nodes -->
    <circle cx="80" cy="10" r="4" fill="#00f2fe" filter="url(#glowCyan)"/>
    <circle cx="145" cy="45" r="4" fill="#a855f7"/>
    <circle cx="145" cy="115" r="4" fill="#ff007f" filter="url(#glowPink)"/>
    <circle cx="80" cy="150" r="4" fill="#00f2fe"/>
    <circle cx="15" cy="115" r="4" fill="#a855f7"/>
    <circle cx="15" cy="45" r="4" fill="#ff007f"/>

    <!-- Inner Core: Reflex Lightning + Code Brackets -->
    <!-- Left Bracket -->
    <path d="M 52 50 L 40 80 L 52 110" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)"/>
    <!-- Right Bracket -->
    <path d="M 108 50 L 120 80 L 108 110" fill="none" stroke="#ff007f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowPink)"/>

    <!-- Center Lightning Bolt (33ms Real-Time Reflex) -->
    <polygon points="83,42 66,82 81,82 77,118 96,74 81,74" 
             fill="url(#accentGrad)" filter="url(#glowCyan)"/>

    <!-- Fast Loop Indicator Orbit -->
    <path d="M 45 42 A 45 45 0 0 1 120 118" fill="none" stroke="url(#cyanPurple)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  </g>

  <!-- Typography & Brand Text -->
  <g transform="translate(250, 65)">
    <!-- Brand Title -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-weight="900" font-size="52" fill="#ffffff" letter-spacing="1">
      LAYA <tspan fill="url(#accentGrad)">ORCHESTRATOR</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="3" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-weight="600" font-size="14.5" fill="#94a3b8" letter-spacing="3.5">
      SYSTEM 1 FAST-DECISION ENGINE (33ms) + SYSTEM 2 CODE EXECUTION
    </text>

    <!-- Feature Badges Inside SVG -->
    <g transform="translate(3, 105)">
      <!-- Badge 1: 33ms Latency -->
      <rect x="0" y="0" width="112" height="24" rx="12" fill="#1e293b" stroke="#00f2fe" stroke-width="1" opacity="0.8"/>
      <text x="56" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#00f2fe" text-anchor="middle">⚡ 33ms REFLEX</text>

      <!-- Badge 2: Calibrated Probabilities -->
      <rect x="122" y="0" width="140" height="24" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1" opacity="0.8"/>
      <text x="192" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">🎯 CALIBRATED RLCD</text>

      <!-- Badge 3: Autonomous Loop -->
      <rect x="272" y="0" width="145" height="24" rx="12" fill="#1e293b" stroke="#ff007f" stroke-width="1" opacity="0.8"/>
      <text x="344.5" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#f43f5e" text-anchor="middle">🔄 CONTINUOUS LOOP</text>
    </g>
  </g>
</svg>
